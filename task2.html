  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Assignment 4</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="task0.html">Task 0</a></li>
          <li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li>
          <li class="nav-item"><a class="nav-link active" href="task2.html">Task 2</a></li>

          <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="page-box">
      <h1>Task 2. Bootstrap Form Styling</h1>
      <p>Contact form with Bootstrap classes and grid.</p>

      <form action="#" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name">
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com">
            <div class="form-text">We will never share your email.</div>
          </div>

          <div class="col-12">
            <label for="subject" class="form-label">Subject</label>
            <select class="form-select" id="subject">
              <option selected>General question</option>
              <option>Support</option>
              <option>Other</option>
            </select>
          </div>

          <div class="col-12">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="5" placeholder="Write your message here"></textarea>
            <div class="form-text">Please write at least 10 characters.</div>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary">Send</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
